project:
  parameters: ../../external/seiler/scripts/parameters.py
  pandapower_net_filename: net.p

# BESS-enhanced combined network. The benchmark loader resolves this filename
# below outputs/<PROJECT>/<scenario>/integration/; PROJECT is not duplicated.
network:
  scenario_filename: net_status_quo_combined_bess.p

benchmark:
  id: full_year_bess
  reference_year: 2025
  time_step_minutes: 15

case:
  scenario_id: status_quo
  realisation: 0

analysis:
  start: "2025-01-01T00:00:00"
  end: "2025-12-31T23:45:00"

outputs:
  root: ../../outputs
  file_type: .csv

solver:
  continue_on_divergence: false